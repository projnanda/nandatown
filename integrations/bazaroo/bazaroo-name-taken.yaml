name: bazaroo-name-taken
description: Failure case - Bazaroo refuses a seller name already owned by another key, and the real listing stays discoverable.
seed: 42
# Bazaroo replaces Town's built-in registry; every other layer uses its default.
layers:
  registry: bazaroo.v1
# Paths are relative to this file.
plugin_files:
  - registry_bazaroo_v1.py
  - validators_bazaroo.py
validator: bazaroo-name-taken
# Run bazaroo-discovery.yaml first with key 1 as BAZAROO_KEY_HW8_SELLER, then run this with a
# DIFFERENT key as BAZAROO_KEY_HW8_SELLER so Bazaroo answers 409 name_taken.
# Bazaroo API keys come from environment variables (never from this file):
#   hw8-seller -> BAZAROO_KEY_HW8_SELLER
#   hw8-buyer  -> BAZAROO_KEY_HW8_BUYER
#   lookups    -> BAZAROO_KEY_LOOKUP
agents:
  - name: hw8-seller
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: hw8-buyer
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1}
faults: []
max_time: 60
