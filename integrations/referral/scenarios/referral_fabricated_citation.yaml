name: referral_fabricated_citation
description: >-
  Two research workers sell sourced competitor facts; the cheaper one fabricates its citations. With trust at referral.v1 the buyer hires through Referral, whose Checker rejects the fabricated quotes; the buyer is refunded, rematches to the honest worker and pays only for checked work, and Town's reputation and registry ranking follow the checks.
seed: 42
validator: referral_fabricated_citation
plugin_files:
  - ../plugin.py
layers:
  trust: referral.v1
agents:
  - name: referral
    role: referral_service
  - name: worker-cheap
    role: research_worker
    config: {behavior: fabricate, ask_cents: 40, balance_cents: 0}
  - name: worker-honest
    role: research_worker
    config: {behavior: honest, ask_cents: 90, balance_cents: 0}
  - name: buyer-1
    role: research_buyer
    config:
      company: Acme Robotics
      slots:
        - {competitor: Cobalt Dynamics, attribute: hq_city}
        - {competitor: Halcyon Motion, attribute: founded_year}
        - {competitor: Ironbark AI, attribute: flagship_product}
        - {competitor: Cobalt Dynamics, attribute: headcount}
      cap_cents: 200
      max_hires: 3
      balance_cents: 1000
redact_fields: [key]
max_time: 60
