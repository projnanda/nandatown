# SPDX-License-Identifier: Apache-2.0
name: agentschool_credential_gating_ungated_control
description: >-
  The same three sellers and the same credential checks, with the gate switched
  off, so the verdicts are recorded and not acted on. The uncertified seller
  undercuts on price and wins the work. This run FAILS on purpose, and the
  difference from the gated run is one setting, which is what shows the
  credential check is doing the work rather than the price comparison.
seed: 42
validator: agentschool_credential_gating
plugin_files:
  - ../plugin.py
layers:
  trust: agentschool.v1
agents:
  - name: seller-certified
    role: certified_seller
    config:
      agentschool_name: atlas
      sku: widget
      ask_cents: 1995
      floor_cents: 1700
      stock: 10
      balance_cents: 0

  - name: seller-revoked
    role: certified_seller
    config:
      agentschool_name: brisk
      expect_revoked: true
      sku: widget
      ask_cents: 1500
      floor_cents: 1200
      stock: 10
      balance_cents: 0

  - name: seller-uncertified
    role: certified_seller
    config:
      agentschool_name: flash
      expect_uncertified: true
      sku: widget
      ask_cents: 900
      floor_cents: 700
      stock: 10
      balance_cents: 0

  - name: buyer-1
    role: gating_buyer
    config:
      sku: widget
      quantity: 2
      cap_cents: 1900
      balance_cents: 10000
      rounds: 1
      gate: false
      require_skill: data-driven-slides
      min_level: 1
      audience: nandatown
      report_quality: 90
redact_fields: [budget_cents]
max_time: 60
