# SPDX-License-Identifier: Apache-2.0
name: agentschool_revoked_credential_fail_closed
description: >-
  The boundary case. The only seller advertising the capability presents a
  credential AgentSchool has revoked, so there is nobody left to hire. The
  correct behavior is to delegate nothing and record why, rather than falling
  back to the agent whose credential was withdrawn.
seed: 42
validator: agentschool_fail_closed
plugin_files:
  - ../plugin.py
layers:
  trust: agentschool.v1
agents:
  - name: seller-revoked
    role: certified_seller
    config:
      agentschool_name: brisk
      expect_revoked: true
      sku: widget
      ask_cents: 1500
      floor_cents: 1200
      stock: 10
      balance_cents: 0

  - name: buyer-1
    role: gating_buyer
    config:
      sku: widget
      quantity: 2
      cap_cents: 1900
      balance_cents: 10000
      rounds: 1
      gate: true
      require_skill: data-driven-slides
      min_level: 1
      audience: nandatown
redact_fields: [budget_cents]
max_time: 60
