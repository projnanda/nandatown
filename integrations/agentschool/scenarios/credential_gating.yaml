# SPDX-License-Identifier: Apache-2.0
name: agentschool_credential_gating
description: >-
  Three sellers advertise the same capability in Town's registry. One holds an
  AgentSchool credential it earned by passing the exam, one holds a credential
  AgentSchool has revoked, and one never earned any. The buyer challenges all
  three, verifies each presentation itself, and delegates and pays only the
  verified holder, then reports the outcome back to AgentSchool.
seed: 42
validator: agentschool_credential_gating
plugin_files:
  - ../plugin.py
layers:
  trust: agentschool.v1
agents:
  - name: seller-certified
    role: certified_seller
    config:
      agentschool_name: atlas
      sku: widget
      ask_cents: 1995
      floor_cents: 1700
      stock: 10
      balance_cents: 0

  # Its credential was issued by AgentSchool and then revoked by the operator,
  # so the signature still verifies and the revocation list is what refuses it.
  - name: seller-revoked
    role: certified_seller
    config:
      agentschool_name: brisk
      expect_revoked: true
      sku: widget
      ask_cents: 1500
      floor_cents: 1200
      stock: 10
      balance_cents: 0

  # It failed the exam, so it has nothing to present. It undercuts both others
  # on price, which is what the gate has to withstand.
  - name: seller-uncertified
    role: certified_seller
    config:
      agentschool_name: flash
      expect_uncertified: true
      sku: widget
      ask_cents: 900
      floor_cents: 700
      stock: 10
      balance_cents: 0

  - name: buyer-1
    role: gating_buyer
    config:
      sku: widget
      quantity: 2
      cap_cents: 1900
      balance_cents: 10000
      rounds: 1
      gate: true
      require_skill: data-driven-slides
      min_level: 1
      audience: nandatown
      report_quality: 90
redact_fields: [budget_cents]
max_time: 60
