name: atl_marketplace
description: Town's marketplace with the Agent Trust Layer as the payments layer. Buyers and sellers discover each other, haggle and pay through escrow; every escrow release to a seller is checked by ATL against the owner's mandate, executed by ATL and backed by a signed receipt.
seed: 42
validator: atl_marketplace
plugin_files: [../atl_payments.py]
layers:
  payments: atl.v1
agents:
  - name: seller-a
    role: seller
    config: {sku: widget, ask_cents: 2100, floor_cents: 1800, stock: 10, balance_cents: 0}
  - name: seller-b
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 2, budget_cents: 10000}
faults:
  - action: duplicate
    kind: delivery
    nth: 1
redact_fields: [budget_cents]
max_time: 60
