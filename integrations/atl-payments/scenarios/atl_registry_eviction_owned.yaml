name: atl_registry_eviction_owned
description: The same eviction attack with both defenses. index.owned.v1 refuses the forged card, so the buyer still finds and pays the honest seller, and ATL checks and receipts that payment. Defense in depth. The index protects discovery, ATL protects the money.
seed: 42
validator: atl_registry_eviction
plugin_files: [../atl_payments.py]
layers:
  registry: index.owned.v1
  payments: atl.v1
agents:
  - name: seller-honest
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: seller-rival
    role: rival_forger
    config: {sku: widget, ask_cents: 2100, floor_cents: 1850, stock: 10, balance_cents: 0, victim: seller-honest, forge_at: 0.1}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1}
max_time: 60
