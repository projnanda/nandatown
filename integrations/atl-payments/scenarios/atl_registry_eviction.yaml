name: atl_registry_eviction
description: Town's registry_eviction_unowned attack (a rival republishes the honest seller's card on the default index.v1, so the buyer only finds the rival) with ATL as the payments layer. The rival is not in the owner's mandate, so ATL must refuse to pay it. Town's discovery stages still fail on purpose; ATL contains the money, not the index.
seed: 42
validator: atl_registry_eviction
plugin_files: [../atl_payments.py]
layers:
  registry: index.v1
  payments: atl.v1
agents:
  - name: seller-honest
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: seller-rival
    role: rival_forger
    config: {sku: widget, ask_cents: 2100, floor_cents: 1850, stock: 10, balance_cents: 0, victim: seller-honest, forge_at: 0.1}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1}
max_time: 60
