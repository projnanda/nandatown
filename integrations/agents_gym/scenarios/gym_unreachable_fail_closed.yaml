name: agents_gym_unreachable_fail_closed
description: >-
  Live mode pointed at a gym that does not answer (a closed local port). No candidate can show a card, so agentsgym.attested.v1 trusts nobody: every file is refused with its reason and no money moves. Unknown is not neutral.
seed: 42
validator: agents_gym_fail_closed
plugin_files:
  - ../plugin.py
layers:
  trust: agentsgym.attested.v1
agents:
  - name: reviewer-honest
    role: gym_candidate
    config:
      gym_name: honest
      sku: loan_review
      ask_cents: 1600
      floor_cents: 1360
      balance_cents: 0
  - name: reviewer-fabricator
    role: gym_candidate
    config:
      gym_name: fabricator
      sku: loan_review
      ask_cents: 900
      floor_cents: 765
      balance_cents: 0
  - name: reviewer-shortcut
    role: gym_candidate
