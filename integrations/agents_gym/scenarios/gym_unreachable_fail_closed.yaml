      gym_name: shortcut
      sku: loan_review
      ask_cents: 1100
      floor_cents: 935
      balance_cents: 0
  - name: reviewer-lazy
    role: gym_candidate
    config:
      gym_name: lazy
      sku: loan_review
      ask_cents: 1200
      floor_cents: 1020
      balance_cents: 0
  - name: reviewer-unstable
    role: gym_candidate
    config:
      gym_name: flaky
      sku: loan_review
      ask_cents: 1400
      floor_cents: 1190
      balance_cents: 0
  - name: lender-1
    role: gym_lender
    config:
      sku: loan_review
      cap_cents: 2000
      balance_cents: 50000
      quotes_wait: 1.0
      pinned_key: ed25519:44fc008abc61ff51a33e760c2a90b288c270bb71c6ecfa82af2d3c630a6d2c35
      gym_url: http://127.0.0.1:9/api/public/evaluate
