name: dutch_auction_naive
description: The same delayed-accept clock with negotiation swapped for dutch.naive.v1, which charges the price showing on arrival; the sale drifts below the price the buyer accepted and the run fails on purpose.
seed: 42
validator: dutch_auction
layers:
  negotiation: dutch.naive.v1
agents:
  - name: seller-1
    role: dutch_seller
    config: {sku: widget, start_cents: 2000, step_cents: 50, floor_cents: 1500, tick_every: 0.25, balance_cents: 0}
  - name: buyer-1
    role: dutch_buyer
    config: {valuation_cents: 1800, quantity: 2, balance_cents: 10000}
redact_fields: [valuation_cents]
faults:
