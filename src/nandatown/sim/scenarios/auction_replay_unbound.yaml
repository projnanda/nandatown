name: auction_replay_unbound
description: The same replay on the default hmac.v1, which signs the body alone; the relabelled result verifies, a bidder who never won pays the full price for nothing, and the run fails on purpose. This is the negative control for hmac.bound.v1.
seed: 42
validator: auction_replay
layers:
  auth: hmac.v1
agents:
  - name: auctioneer
    role: auctioneer
    config: {item: print-001, close_after: 3.0, balance_cents: 0}
  - name: bidder-x
    role: result_replayer
    config: {valuation_cents: 700, bid_delay: 1.0, balance_cents: 2000, victim: bidder-late}
  - name: bidder-y
    role: bidder
    config: {valuation_cents: 900, bid_delay: 1.2, balance_cents: 2000}
  - name: bidder-late
    role: bidder
    config: {valuation_cents: 950, bid_delay: 6.0, balance_cents: 2000}
max_time: 60
