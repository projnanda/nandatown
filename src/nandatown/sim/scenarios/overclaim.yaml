name: overclaim
description: A steady seller honours nearly every order and says so; a busy one has four times the customers, honours seven orders in ten and says it is certain. reputation.calibrated.v1 scores each seller on how well what it said matched what arrived, so a shopper who buys from whoever the registry lists first still mostly gets what it ordered.
seed: 42
layers:
  trust: reputation.calibrated.v1
agents:
  - name: seller-steady
    role: promising_seller
    config: {sku: widget, honour_rate: 0.95, says: 0.95}
  - name: seller-busy
    role: promising_seller
    config: {sku: widget, honour_rate: 0.7, says: 0.99}
  - {name: steady-regular-1, role: regular, config: {seller: seller-steady, orders: 15}}
  - {name: steady-regular-2, role: regular, config: {seller: seller-steady, orders: 15}}
  - {name: busy-regular-1, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-2, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-3, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-4, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-5, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-6, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-7, role: regular, config: {seller: seller-busy, orders: 15}}
  - {name: busy-regular-8, role: regular, config: {seller: seller-busy, orders: 15}}
  - name: shopper
    role: shopper
    config: {sku: widget, orders: 30, start_after: 40.0, expect_share: 0.8}
max_time: 200
