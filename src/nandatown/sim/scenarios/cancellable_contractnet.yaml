name: cancellable_contractnet
description: An issuer cancels an open Contract-Net task before an in-flight delayed bid arrives, so the late bid and later award are rejected.
seed: 42
layers:
  coordination: contractnet.cancel.v1
agents:
  - name: issuer
    role: task_issuer
    config: {task_id: cancellable-task-1, work: inspect, start_after: 0.5, cancel_after: 0.4, award_after: 1.5}
  - name: bidder
    role: task_bidder
    config: {bid_cents: 400, send_after: 0.0}
faults:
  - action: delay
    kind: task_bid
    nth: 1
    delay: 1.0
max_time: 10
