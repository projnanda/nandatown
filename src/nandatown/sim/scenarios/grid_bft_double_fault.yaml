name: grid_bft_double_fault
description: >
  Same four grid nodes, but two of them are Byzantine at once:
  frequency-controller and substation-1. With n=4, the protocol only
  tolerates f=(n-1)//3=1; two Byzantine nodes is past that boundary on
  purpose. Each targets substation-2 with shed_load_5mw and
  substation-3 with inject_reserve_3mw, so the two remaining honest
  nodes each independently reach a real local quorum for a different
  value. The grid_bft validator's agreement stage is expected to FAIL
  here: that failure is the evidence that the fault-tolerance boundary
  was actually crossed, not a bug in the town or the protocol.
validator: grid_bft
seed: 13
agents:
  - name: frequency-controller
    role: grid_node
    config:
      initiator: true
      value: shed_load_5mw
      equivocation:
        targets_a: [substation-2]
        value_a: shed_load_5mw
        targets_b: [substation-3]
        value_b: inject_reserve_3mw
  - name: substation-1
    role: grid_node
    config:
      equivocation:
        targets_a: [substation-2]
        value_a: shed_load_5mw
        targets_b: [substation-3]
        value_b: inject_reserve_3mw
  - name: substation-2
    role: grid_node
    config: {}
  - name: substation-3
    role: grid_node
    config: {}
faults: []
max_time: 30
