name: marketplace_expiring_memory
description: Marketplace where the buyer's remembered seller expires between rounds, so round two must rediscover through the index instead of reusing stale memory.
seed: 42
layers:
  memory: ttl.v1
agents:
  - name: seller-a
    role: seller
    config: {sku: widget, ask_cents: 2100, floor_cents: 1800, stock: 10, balance_cents: 0}
  - name: seller-b
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 2, budget_cents: 10000, memory_ttl: {preferred_seller: 0.5}}
faults:
  - action: duplicate
    kind: delivery
    nth: 1
redact_fields: [budget_cents]
max_time: 60
