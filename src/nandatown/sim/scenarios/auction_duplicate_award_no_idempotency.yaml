name: auction_duplicate_award_no_idempotency
description: The same duplicated award on the default ledger.v1, which settles every transfer it is handed; the winner is charged twice and the run FAILS on purpose, showing what idempotent payments are for.
seed: 42
validator: auction_duplicate_award
layers:
  payments: ledger.v1
agents:
  - name: auctioneer
    role: auctioneer
    config: {item: print-001, close_after: 3.0, balance_cents: 0}
  - name: bidder-x
    role: bidder
    config: {valuation_cents: 700, bid_delay: 1.0, balance_cents: 2000}
  - name: bidder-y
    role: bidder
    config: {valuation_cents: 900, bid_delay: 1.2, balance_cents: 2000}
  - name: bidder-late
    role: bidder
    config: {valuation_cents: 950, bid_delay: 6.0, balance_cents: 2000}
faults:
  - action: duplicate
    kind: auction_won
    nth: 1
max_time: 60
