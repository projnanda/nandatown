name: integrity_test

description: |
  Test message integrity checking with transport faults.
  A buyer and seller exchange quote messages. Transport layer may duplicate
  or delay messages, naturally corrupting message bodies. The communication
  layer with SHA256 integrity checksums detects and rejects corrupted messages
  before agents process them.

seed: 42

agents:
  - name: seller-1
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 2000, balance_cents: 10000, rounds: 1}

max_time: 60

layers:
  communication: envelope_integrity.v1

faults:
  - action: duplicate
    rate: 0.3
  - action: delay
    rate: 0.2
