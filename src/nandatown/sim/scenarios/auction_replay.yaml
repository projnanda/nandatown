name: auction_replay
description: A losing bidder replays the auctioneer's signed result to a bidder who never won, relabelled as the win notice. Under hmac.bound.v1 the signature covers the recipient and the kind, so the replay is refused and only the winner pays.
seed: 42
layers:
  auth: hmac.bound.v1
agents:
  - name: auctioneer
    role: auctioneer
    config: {item: print-001, close_after: 3.0, balance_cents: 0}
  - name: bidder-x
    role: result_replayer
    config: {valuation_cents: 700, bid_delay: 1.0, balance_cents: 2000, victim: bidder-late}
  - name: bidder-y
    role: bidder
    config: {valuation_cents: 900, bid_delay: 1.2, balance_cents: 2000}
  - name: bidder-late
    role: bidder
    config: {valuation_cents: 950, bid_delay: 6.0, balance_cents: 2000}
max_time: 60
