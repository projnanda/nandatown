name: grid_bft_byzantine_voter
description: >
  Four grid nodes run a Byzantine broadcast round over a frequency
  anomaly response. The honest controller proposes shed_load_5mw.
  Substation-1 is Byzantine and equivocates at every phase, telling
  frequency-controller one value and substation-2/substation-3
  another. With n=4 this is f=1, inside tolerance (f<=(n-1)//3=1): the
  three honest nodes must still agree, and agree with the controller.
validator: grid_bft
seed: 7
agents:
  - name: frequency-controller
    role: grid_node
    config: {initiator: true, value: shed_load_5mw}
  - name: substation-1
    role: grid_node
    config:
      equivocation:
        targets_a: [frequency-controller]
        value_a: shed_load_5mw
        targets_b: [substation-2, substation-3]
        value_b: inject_reserve_3mw
  - name: substation-2
    role: grid_node
    config: {}
  - name: substation-3
    role: grid_node
    config: {}
faults: []
max_time: 30
