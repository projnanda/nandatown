name: registry_eviction_unowned
description: The same eviction scenario on the default index.v1, where a listing has no owner; the forged card replaces the honest seller's verified card, the buyer only finds the rival, and the run fails on purpose. This is the negative control for index.owned.v1.
seed: 42
validator: registry_eviction
layers:
  registry: index.v1
agents:
  - name: seller-honest
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: seller-rival
    role: rival_forger
    config: {sku: widget, ask_cents: 2100, floor_cents: 1850, stock: 10, balance_cents: 0, victim: seller-honest, forge_at: 0.1}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1}
max_time: 60
