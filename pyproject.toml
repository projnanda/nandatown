[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nandatown"
version = "0.2.0"
description = "Local-first NANDA Town sandbox and test harness. Bring an agent, give it a task, break something on purpose, leave with evidence."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "textual>=1.0",
    "textual-serve>=1.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web-evidence = ["playwright>=1.48"]

[project.scripts]
nandatown = "nandatown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nandatown = ["sim/scenarios/*.yaml", "skills/builtin/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
