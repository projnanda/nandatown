name: flex_race_lost_response
description: Both buyers want 400 kW of seller-1's 500 kW. buyer-1's first hold result is lost and it retries the identical request; buyer-2's hold reaches the desk twice.
seed: 7
validator: bona_flex
plugin_files: [../bona_flex_validator.py, ../bona_flex_roles.py]
redact_fields: [budget_cents]
max_time: 60
faults:
  - {action: drop, kind: flex_hold_result, nth: 1}
  - {action: duplicate, kind: flex_hold, nth: 2}
agents:
  - name: desk
    role: flex_desk
    config: {sellers: [S_SYN_DC_1, S_SYN_PVB_1], meter: meter, settle_at: 20.0, expect_grants: [[hold, 400000, false], [hold, 100000, true]]}
  - name: seller-1
    role: flex_seller
    config: {seller_id: S_SYN_DC_1, price_musd_per_mwh: 50000, balance_cents: 0}
  - name: seller-2
    role: flex_seller
    config: {seller_id: S_SYN_PVB_1, price_musd_per_mwh: 45000, balance_cents: 0}
  - name: buyer-1
    role: flex_buyer
    config: {buyer_id: buyer-1, legal_entity: LE_SYN_BUYER_1, desk: desk, seller: seller-1, want_w: 400000, start_at: 0.5, retry_after: 2.0, balance_cents: 100000, budget_cents: 100000}
  - name: buyer-2
    role: flex_buyer
    config: {buyer_id: buyer-2, legal_entity: LE_SYN_BUYER_2, desk: desk, seller: seller-1, want_w: 400000, start_at: 0.5, retry_after: 2.0, balance_cents: 100000, budget_cents: 100000}
  - name: meter
    role: flex_meter
    config: {balance_cents: 0}
