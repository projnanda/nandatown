name: lost-link-dropped-review
description: Drop the review notification; the case must stay submitted with no pickup instructions or human approval.
validator: lost-link-lifecycle@1
plugin_files: [adapter.py]
seed: 42
agents:
  - {name: finder, role: lostlink.finder}
  - {name: owner, role: lostlink.owner}
  - {name: operator, role: lostlink.human_fixture}
faults:
  - {action: drop, kind: lostlink_review_requested, nth: 1}
redact_fields: [private_detail, your_private_detail, Authorization, X-Human-Token]
max_time: 10
