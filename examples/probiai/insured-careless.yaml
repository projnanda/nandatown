name: probiai-insured-careless
description: "A careless buyer takes the duplicated delivery as a new bill and pays the seller again. ProbiAI, watching the buyer's payments, should open a double-payment claim that matches Town's ledger."
seed: 42
plugin_files: [probiai_insured_ledger.py]
layers:
  payments: probiai-insured.v1
validator: probiai-insured
agents:
  - name: seller-a
    role: seller
    config: {sku: widget, ask_cents: 2100, floor_cents: 1800, stock: 10, balance_cents: 0}
  - name: seller-b
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: buyer-1
    role: careless_buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1, budget_cents: 10000}
faults:
  - action: duplicate
    kind: delivery
    nth: 1
redact_fields: [budget_cents]
max_time: 60
