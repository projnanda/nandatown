name: probiai-insured-repeat
description: "Boundary: two separate orders from the same seller at the same price, each paid once. A double-payment rule that only compares amount and seller would raise a false alarm here."
seed: 42
plugin_files: [probiai_insured_ledger.py]
layers:
  payments: probiai-insured.v1
validator: probiai-insured
agents:
  - name: seller-a
    role: seller
    config: {sku: widget, ask_cents: 2100, floor_cents: 1800, stock: 10, balance_cents: 0}
  - name: seller-b
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 2, budget_cents: 10000}
faults:
  - action: duplicate
    kind: delivery
    nth: 1
redact_fields: [budget_cents]
max_time: 60
