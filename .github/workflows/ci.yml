name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nest-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/nest-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dashboard production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke run (Lab)
        run: nandatown run marketplace --out /tmp/runs
      - name: Smoke run (Track)
        run: nandatown run quote-crash-restart --out /tmp/runs

  web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional browser integration dependencies
        run: pip install -e ".[dev,web-evidence]"
      - name: Install local Chromium
        run: python -m playwright install --with-deps chromium
      - name: Paired fixture browser checks (no model API)
        env:
          NANDATOWN_RUN_BROWSER_TESTS: "1"
        run: python scripts/run_offline_checks.py tests/test_atlas_browser.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build source and wheel artifacts
        run: |
          python -m pip install build
          python -m build
          python scripts/check_distributions.py dist
      - name: Install the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/town-wheel-env"
          "$RUNNER_TEMP/town-wheel-env/bin/python" -m pip install dist/*.whl
      - name: Installed-wheel controls
        working-directory: ${{ runner.temp }}
        env:
          NANDATOWN_HOME: ${{ runner.temp }}/town-wheel-state
        run: |
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" run marketplace --out "$RUNNER_TEMP/town-wheel-runs"
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" run quote-crash-restart --out "$RUNNER_TEMP/town-wheel-runs"
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" skills
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" web-evidence-protected --help
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" web-evidence-piguard --help
          "$RUNNER_TEMP/town-wheel-env/bin/nandatown" web-evidence --help
          "$RUNNER_TEMP/town-wheel-env/bin/python" -c "from nandatown.promptarmor_guard import upstream; upstream()"
